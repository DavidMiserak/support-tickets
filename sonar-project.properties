# SonarQube Configuration for Support Ticket Microservice
sonar.projectKey=stm
sonar.projectName=Support Ticket Microservice
sonar.projectVersion=1.0
sonar.projectBaseDir=.
# sonar.organization is provided at runtime (see Makefile `sonar` target)

# Source code location
sonar.sources=app
sonar.tests=app/tests
sonar.test.inclusions=app/tests/**/*.py
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/venv/**,**/.pytest_cache/**,**/build/**,**/dist/**
sonar.coverage.exclusions=app/tests/**

# Python specific settings
sonar.python.version=3.12

# Coverage report
sonar.python.coverage.reportPaths=coverage.xml
