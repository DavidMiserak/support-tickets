# compose.yaml
services:
    api:
        build:
            context: .
            dockerfile: Containerfile
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: postgresql+asyncpg://ticketsupport:ticketsupport@db:5432/ticketsupport
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    # Run the test suite against a real Postgres. Enabled only via the `test`
    # profile: `docker compose --profile test run --rm test`.
    test:
        build:
            context: .
            dockerfile: Containerfile
            target: test
        profiles: ["test"]
        environment:
            TEST_DATABASE_URL: postgresql+asyncpg://ticketsupport:ticketsupport@db:5432/ticketsupport_test
        depends_on:
            db:
                condition: service_healthy

    db:
        image: docker.io/library/postgres:16-alpine
        environment:
            POSTGRES_DB: ticketsupport
            POSTGRES_USER: ticketsupport
            POSTGRES_PASSWORD: ticketsupport
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ticketsupport -d ticketsupport"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - postgres_data:/var/lib/postgresql/data
            # Creates the isolated `ticketsupport_test` database on first init.
            - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
        restart: unless-stopped

volumes:
    postgres_data:
