# compose.yaml
services:
    api:
        build:
            context: .
            dockerfile: Containerfile
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: postgresql+asyncpg://ticketsupport:ticketsupport@db:5432/ticketsupport
            REDIS_URL: redis://redis:6379
            LOG_LEVEL: ${LOG_LEVEL:-INFO}  # override: LOG_LEVEL=DEBUG docker compose up
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        # Overrides the HEALTHCHECK in the Containerfile. Uses /health (pure
        # liveness, no DB/Redis I/O) so the worker waits until uvicorn is
        # serving, not until all dependencies are reachable. start_period: 30s
        # gives migrations headroom before the first probe is evaluated.
        healthcheck:
            test: ["CMD", "python", "-c",
                   "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
            interval: 10s
            timeout: 5s
            start_period: 30s
            retries: 5

    redis:
        image: docker.io/library/redis:7-alpine
        # Message broker for the arq background worker.
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    worker:
        build:
            context: .
            dockerfile: Containerfile
        # Runs the arq background worker. Picks up jobs enqueued by the API.
        # The API service (via scripts/start.sh) owns migrations; the worker
        # waits for the API to be healthy before starting so migrations are
        # guaranteed to be applied before any job processing begins.
        command: python -m arq app.worker.main.WorkerSettings
        environment:
            DATABASE_URL: postgresql+asyncpg://ticketsupport:ticketsupport@db:5432/ticketsupport
            REDIS_URL: redis://redis:6379
            # Default: noop (no model download). For transformer, extend the image
            # with requirements-ml.txt and set SUMMARIZER_BACKEND=transformer.
            SUMMARIZER_BACKEND: noop
            LOG_LEVEL: ${LOG_LEVEL:-INFO}  # override: LOG_LEVEL=DEBUG docker compose up
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            api:
                condition: service_healthy
        # Note: restart: unless-stopped re-starts the worker without re-checking
        # depends_on. This is safe — migrations are already applied and the worker
        # uses its own DB/Redis connections directly.
        restart: unless-stopped

    # Run the test suite against a real Postgres. Enabled only via the `test`
    # profile: `docker compose --profile test run --rm test`.
    test:
        build:
            context: .
            dockerfile: Containerfile
            target: test
        profiles: ["test"]
        environment:
            TEST_DATABASE_URL: postgresql+asyncpg://ticketsupport:ticketsupport@db:5432/ticketsupport_test
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    db:
        image: docker.io/library/postgres:16-alpine
        environment:
            POSTGRES_DB: ticketsupport
            POSTGRES_USER: ticketsupport
            POSTGRES_PASSWORD: ticketsupport
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ticketsupport -d ticketsupport"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - postgres_data:/var/lib/postgresql/data
            # Creates the isolated `ticketsupport_test` database on first init.
            - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
        restart: unless-stopped

volumes:
    postgres_data:
